name: CD - Deploy to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy backend, BFF and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      AR_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
      API_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_API_SERVICE_ACCOUNT }}
      BFF_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_BFF_SERVICE_ACCOUNT }}
      VPC_CONNECTOR: ${{ vars.CLOUD_RUN_VPC_CONNECTOR }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      API_SERVICE: supreme-court-rag-api
      BFF_SERVICE: supreme-court-rag-bff
      FRONTEND_SERVICE: supreme-court-rag-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend and BFF images
        run: |
          set -euo pipefail
          registry="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          docker build -f backend/Dockerfile -t "${registry}/backend:${GITHUB_SHA}" backend/
          docker build -f backend/bff/Dockerfile -t "${registry}/bff:${GITHUB_SHA}" backend/bff/
          docker push "${registry}/backend:${GITHUB_SHA}"
          docker push "${registry}/bff:${GITHUB_SHA}"

      - name: Deploy backend
        env:
          DATABASE_URL: ${{ secrets.SCJ_DATABASE_URL }}
          REDIS_URL: ${{ secrets.BACKEND_REDIS_URL }}
          AUTH_CHALLENGE_SECRET: ${{ secrets.BACKEND_AUTH_CHALLENGE_SECRET }}
        run: |
          set -euo pipefail
          # The backend needs some CORS origin to start. Reuse the current frontend
          # URL if it exists; the last step sets the real one after the frontend deploys.
          cors="$(gcloud run services describe "$FRONTEND_SERVICE" --region="$REGION" \
            --format='value(status.url)' 2>/dev/null || true)"
          cors="${cors:-https://pending-frontend.invalid}"
          # Secret values may contain commas or quotes, so pass env vars as a file.
          env_file="${RUNNER_TEMP}/api-env.yaml"
          trap 'rm -f "$env_file"' EXIT
          jq -n --arg cors "$cors" '{
            APP_ENV: "production",
            CORS_ORIGINS: $cors,
            SESSION_COOKIE_NAME: "__Host-nm_session",
            ADMIN_SESSION_COOKIE_NAME: "__Host-nm_admin_session",
            SESSION_COOKIE_SAMESITE: "none",
            SMTP_HOST: env.SMTP_HOST,
            SMTP_PORT: "587",
            SMTP_FROM_EMAIL: env.SMTP_FROM_EMAIL,
            SMTP_STARTTLS: "true",
            RETRIEVAL_PORT_ADAPTER_ENABLED: "false",
            DATABASE_URL: env.DATABASE_URL,
            REDIS_URL: env.REDIS_URL,
            AUTH_CHALLENGE_SECRET: env.AUTH_CHALLENGE_SECRET
          }' > "$env_file"
          vpc_flags=()
          if [[ -n "${VPC_CONNECTOR:-}" ]]; then
            vpc_flags=(--vpc-connector="$VPC_CONNECTOR" --vpc-egress=private-ranges-only)
          fi
          gcloud run deploy "$API_SERVICE" \
            --image="${REGISTRY}/backend:${GITHUB_SHA}" \
            --region="$REGION" \
            --no-allow-unauthenticated \
            --service-account="$API_RUNTIME_SERVICE_ACCOUNT" \
            "${vpc_flags[@]}" \
            --port=8080 \
            --env-vars-file="$env_file" \
            --set-secrets="GROQ_API_KEY=backend-groq-api-key:latest,SMTP_USERNAME=backend-smtp-username:latest,SMTP_PASSWORD=backend-smtp-password:latest" \
            --memory=1Gi \
            --max-instances=5 \
            --timeout=120s \
            --quiet

      - name: Deploy BFF
        run: |
          set -euo pipefail
          backend_url="$(gcloud run services describe "$API_SERVICE" --region="$REGION" \
            --format='value(status.url)')"
          gcloud run deploy "$BFF_SERVICE" \
            --image="${REGISTRY}/bff:${GITHUB_SHA}" \
            --region="$REGION" \
            --allow-unauthenticated \
            --service-account="$BFF_RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars="BACKEND_URL=${backend_url}" \
            --port=8080 \
            --memory=512Mi \
            --max-instances=10 \
            --timeout=120s \
            --quiet

      - name: Build, push and deploy frontend
        run: |
          set -euo pipefail
          bff_url="$(gcloud run services describe "$BFF_SERVICE" --region="$REGION" \
            --format='value(status.url)')"
          image="${REGISTRY}/frontend:${GITHUB_SHA}"
          docker build -f frontend/Dockerfile.frontend \
            --build-arg VITE_API_URL=/api \
            --build-arg BFF_URL="$bff_url" \
            -t "$image" frontend/
          docker push "$image"
          gcloud run deploy "$FRONTEND_SERVICE" \
            --image="$image" \
            --region="$REGION" \
            --allow-unauthenticated \
            --port=8080 \
            --memory=256Mi \
            --max-instances=5 \
            --quiet

      - name: Point backend CORS at the frontend URL
        run: |
          set -euo pipefail
          frontend_url="$(gcloud run services describe "$FRONTEND_SERVICE" --region="$REGION" \
            --format='value(status.url)')"
          current="$(gcloud run services describe "$API_SERVICE" --region="$REGION" \
            --format=json | jq -r '.spec.template.spec.containers[0].env[]
              | select(.name == "CORS_ORIGINS") | .value')"
          if [[ "$current" != "$frontend_url" ]]; then
            gcloud run services update "$API_SERVICE" --region="$REGION" \
              --update-env-vars="CORS_ORIGINS=${frontend_url}" --quiet
          fi
          echo "Frontend: $frontend_url"
