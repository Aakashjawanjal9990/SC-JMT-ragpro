[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supreme-court-rag-backend"
version = "0.1.0"
description = "Query API and RAG orchestration for Supreme Court judgments"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "asyncpg>=0.30,<1.0",
    "email-validator>=2.2,<3.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic>=2.9,<3.0",
    "redis>=5.2,<7.0",
    "numpy>=2.0,<3.0",
    "scipy>=1.11,<2.0",
    "bm25s>=0.3,<0.4",
    "SQLAlchemy[asyncio]>=2.0.36,<3.0",
    "pg8000>=1.31,<2.0",
    "cloud-sql-python-connector[pg8000]>=1.18,<2.0",
    "google-cloud-alloydb-connector[pg8000]>=1.9,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.8,<2.0",
    "mypy>=1.14,<2.0",
    "pip-audit>=2.7,<3.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["S608"]
